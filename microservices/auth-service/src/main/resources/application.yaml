server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service
  profiles:
    default: local
  config:
    import: optional:file:../../.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: always